<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Error 400 | WildEcho</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ФОН ТА ВІДЕО */
.mc-error-page {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
}

.mc-bg-video {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%; min-height: 100%;
    object-fit: cover;
    z-index: -2;
}

.mc-video-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8); /* Глибоке затемнення */
    z-index: -1;
}

/* ОСНОВНА ПАНЕЛЬ (стиль Minecraft.net) */
.mc-error-container {
    width: 100%;
    max-width: 900px;
    padding: 20px;
    z-index: 10;
}

.mc-error-content {
    background-color: #1a1a1a; /* Темно-сірий антрацит */
    border: 1px solid #333;
    padding: 60px;
    position: relative;
}

/* ТЕГИ ТА ЗАГОЛОВКИ */
.mc-error-tag {
    background-color: #fff;
    color: #000;
    padding: 4px 12px;
    font-weight: 900;
    font-size: 14px;
    text-transform: uppercase;
    display: inline-block;
    margin-bottom: 20px;
}

.mc-error-title {
    font-family: 'Impact', sans-serif;
    font-size: 52px;
    color: #fff;
    margin: 0;
    letter-spacing: 2px;
}

.mc-error-body-text {
    margin: 30px 0;
    font-size: 18px;
    line-height: 1.6;
    color: #fff;
}

.mc-divider {
    border: none;
    border-top: 1px solid #333;
    margin: 40px 0;
}

/* ФУТЕР ПАНЕЛІ */
.mc-error-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.mc-error-info p {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
}

.mc-status-code {
    color: #ff4d4d; /* Червоний колір для помилки */
    font-weight: bold;
    font-size: 12px;
}

/* КНОПКА (Офіційний стиль) */
.mc-home-btn {
    background-color: #fff;
    color: #888; /* Колір тексту як на фото */
    text-decoration: none;
    padding: 15px 40px;
    font-weight: 900;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: 0.2s;
}

.mc-home-btn:hover {
    background-color: #3c8527; /* Зелений при наведенні */
    color: #fff;
}

.mc-home-btn .mc-arrow {
    font-size: 26px;
    line-height: 1;
}

/* Адаптивність */
@media (max-width: 768px) {
    .mc-error-content { padding: 30px; }
    .mc-error-title { font-size: 32px; }
    .mc-error-footer { flex-direction: column; align-items: center; text-align: center; }
    .mc-home-btn { width: 100%; justify-content: center; margin-top: 30px; }
}
</style>
</head>
<body class="mc-error-page">

    <!-- ВІДЕО ФОН (сильно затемнений) -->
    <video autoplay muted loop playsinline class="mc-bg-video">
        <source src="/hellow-video.mp4" type="video/mp4">
    </video>
    <div class="mc-video-overlay"></div>

    <!-- КОНТЕЙНЕР У СТИЛІ MINECRAFT.NET -->
    <div class="mc-error-container">
        <div class="mc-error-content">
            
            <div class="mc-error-header">
                <span class="mc-error-tag">ERROR 400</span>
                <h1 class="mc-error-title">ПОГАНИЙ ЗАПИТ</h1>
            </div>

            <div class="mc-error-body-text">
                <p>Ваш браузер надіслав запит, який сервер не зміг розпізнати. Схоже, цей чанк даних виявився битим або шлях до нього заблоковано бедроком.</p>
            </div>

            <hr class="mc-divider">

            <div class="mc-error-footer">
                <div class="mc-error-info">
                    <p>Спробуйте оновити сторінку або повернутися на головну.</p>
                    <span class="mc-status-code">* STATUS: BAD_REQUEST</span>
                </div>
                
                <!-- Кнопка як на офіційному сайті -->
                <a href="/index.html" class="mc-home-btn">
                    НА ГОЛОВНУ <span class="mc-arrow">›</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
